name: Activity cards

on:
  schedule:
    # 05:17 UTC, a few minutes off the hour so the runner queue is short
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # only re-render when the generator itself changes, never on the commit
    # this workflow makes, so it cannot trigger itself
    paths:
      - 'scripts/generate-cards.mjs'
      - '.github/workflows/cards.yml'

permissions:
  contents: write

concurrency:
  group: activity-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render cards
        env:
          # the default token is enough for the public contribution graph;
          # set a CARDS_TOKEN secret only if you ever need wider scope
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/generate-cards.mjs

      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          if git diff --staged --quiet; then
            echo 'No change in the cards.'
          else
            git commit -m 'chore: refresh activity cards'
            git push
          fi
