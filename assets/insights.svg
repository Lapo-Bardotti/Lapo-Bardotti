<svg xmlns="http://www.w3.org/2000/svg" width="840" height="206" viewBox="0 0 840 206" role="img" aria-label="Production impact and stack">
  <style>
    :root{
      --bg:#ffffff; --fg:#0f172a; --muted:#6b7688;
      --glass-a:rgba(15,23,42,.055); --glass-b:rgba(15,23,42,.012);
      --line:rgba(15,23,42,.10); --spec:rgba(255,255,255,.95);
      --empty:rgba(15,23,42,.065); --grid:rgba(15,23,42,.07);
      --track:rgba(15,23,42,.06);
      --a1:#4f7cf7; --a2:#8b5cf6; --blob:.16; --shadow:.07;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --bg:#0b0e13; --fg:#e7eaf0; --muted:#8a94a6;
        --glass-a:rgba(255,255,255,.072); --glass-b:rgba(255,255,255,.018);
        --line:rgba(255,255,255,.10); --spec:rgba(255,255,255,.55);
        --empty:rgba(255,255,255,.062); --grid:rgba(255,255,255,.06);
        --track:rgba(255,255,255,.06);
        --a1:#7aa2f7; --a2:#a78bfa; --blob:.30; --shadow:.5;
      }
    }
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .bg{fill:var(--bg)}
    .hair{fill:none;stroke:var(--line);stroke-width:1}
    .spec{fill:none;stroke:url(#specG);stroke-width:1}
    .track{fill:var(--track)}
    .ga{stop-color:var(--glass-a)} .gb{stop-color:var(--glass-b)}
    .c1{stop-color:var(--a1)} .c2{stop-color:var(--a2)}
    .blob1{fill:var(--a1)} .blob2{fill:var(--a2)}
    .key{font-size:10px;font-weight:600;letter-spacing:.1em;fill:var(--muted)}
    .val{font-size:26px;font-weight:600;letter-spacing:-.02em;fill:var(--fg)}
    .big{font-size:21px;font-weight:600;letter-spacing:-.02em;fill:var(--fg)}
    .sub{font-size:11px;font-weight:400;fill:var(--muted)}
    .ttl{font-size:12.5px;font-weight:600;letter-spacing:-.01em;fill:var(--fg)}
    .row{font-size:11.5px;font-weight:500;fill:var(--fg)}
    .tick{font-size:9.5px;font-weight:500;fill:var(--muted)}
    .l0{fill:var(--empty)}
    .l1{fill:var(--a1);opacity:.30}
    .l2{fill:var(--a1);opacity:.55}
    .l3{fill:var(--a1);opacity:.80}
    .l4{fill:var(--a2);opacity:.95}
    .s0{fill:var(--a1)}
    .s1{fill:var(--a1);opacity:.74}
    .s2{fill:var(--a1);opacity:.5}
    .s3{fill:var(--a2);opacity:.88}
    .s4{fill:var(--a2);opacity:.62}
    .s5{fill:var(--a2);opacity:.42}
    .s6{fill:var(--muted);opacity:.34}
  </style>
  <defs>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="ga"/><stop offset="1" class="gb"/>
    </linearGradient>
    <linearGradient id="specG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--spec)" stop-opacity="0"/>
      <stop offset=".5" stop-color="var(--spec)" stop-opacity=".7"/>
      <stop offset="1" stop-color="var(--spec)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="c1"/><stop offset="1" class="c2"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="drop" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0b1020" flood-opacity="var(--shadow)"/>
    </filter>
  </defs>
<g filter="url(#drop)"><rect x="0" y="0" width="413" height="206" rx="16" class="bg"/></g>
  <clipPath id="clipimp"><rect x="0" y="0" width="413" height="206" rx="16"/></clipPath>
  <g clip-path="url(#clipimp)">
    <rect x="0" y="0" width="413" height="206" class="bg"/>
    <g filter="url(#soft)"><circle cx="61.95" cy="24.72" r="78" class="blob2" opacity="var(--blob)"/><circle cx="371.7" cy="206" r="66" class="blob1" opacity="var(--blob)"/></g>
    <rect x="0" y="0" width="413" height="206" fill="url(#glassG)"/>
  </g>
  <rect x="0.5" y="0.5" width="412" height="205" rx="15.5" class="hair"/>
  <path d="M 16 0.5 H 397" class="spec"/>
  <text x="22" y="30" class="ttl">In production</text>
  <text x="22" y="48" class="sub">LGPD compliant by design</text>
  <text x="22" y="82" class="big">1,000+</text>
  <text x="22" y="99" class="sub">doctors on the platforms</text>
  <text x="22" y="123" class="big">~200</text>
  <text x="22" y="140" class="sub">consults per week</text>
  <text x="22" y="164" class="big">4</text>
  <text x="22" y="181" class="sub">countries served · BR · US · ES · IT</text>
<g filter="url(#drop)"><rect x="427" y="0" width="413" height="206" rx="16" class="bg"/></g>
  <clipPath id="clipstk"><rect x="427" y="0" width="413" height="206" rx="16"/></clipPath>
  <g clip-path="url(#clipstk)">
    <rect x="427" y="0" width="413" height="206" class="bg"/>
    <g filter="url(#soft)"><circle cx="476.56" cy="20.6" r="72" class="blob1" opacity="var(--blob)"/><circle cx="790.44" cy="210.12" r="70" class="blob2" opacity="var(--blob)"/></g>
    <rect x="427" y="0" width="413" height="206" fill="url(#glassG)"/>
  </g>
  <rect x="427.5" y="0.5" width="412" height="205" rx="15.5" class="hair"/>
  <path d="M 443 0.5 H 824" class="spec"/>
  <text x="449" y="30" class="ttl">Stack in production</text>
  <text x="449" y="48" class="sub">declared, not measured</text>
  <text x="449" y="80" class="key">BACKEND</text>
  <text x="523" y="80" class="row">Java · Spring Boot · Node</text>
  <text x="449" y="104" class="key">FRONTEND</text>
  <text x="523" y="104" class="row">Next.js · React · React Native</text>
  <text x="449" y="128" class="key">DATA</text>
  <text x="523" y="128" class="row">PostgreSQL · MongoDB · Redis</text>
  <text x="449" y="152" class="key">INFRA</text>
  <text x="523" y="152" class="row">AWS · Docker · GitHub Actions</text>
  <text x="449" y="176" class="key">AI</text>
  <text x="523" y="176" class="row">RAG · MCP · embedded agents</text>
</svg>
